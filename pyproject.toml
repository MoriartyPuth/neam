[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neam"
version = "0.1.0"
description = "Neam (នាម): Khmer news named entity recognition (PER, ORG, LOC)"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "torch>=2.0",
  "transformers>=4.35,<5",
  "huggingface_hub>=0.34,<1.0",
  "khmer-nltk>=1.5",
  "regex",
  "sentencepiece>=0.1.99",
  "protobuf>=4.25",
  "requests>=2.31",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
app = ["gradio>=4,<7"]

[project.urls]
Homepage = "https://github.com/MoriartyPuth/neam"
Model = "https://huggingface.co/MoriartyPuth/neam"

[tool.setuptools]
packages = ["neam"]
